<body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen">

  <main class="flex flex-col relative w-full bg-surface min-h-screen">

        <div class="relative mb-space-sm group">

            Est. 24
          </div>
        </div>
        <h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">
          Blendique Coffee Club

          Welcome back to your curated daily ritual and small-batch roastery perks.
        </p>

      <!-- Segmented Tab Toggle -->

  class="flex-1 py-2.5 rounded-full text-center font-label-lg text-label-lg transition-all duration-200 bg-primary-container text-on-primary shadow-sm"
  id="tab-signin" onclick="switchAuthTab('signin')">
          Sign In

        <button type="button"
  class="flex-1 py-2.5 rounded-full text-center font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface"
  id="tab-signup" onclick="switchAuthTab('signup')">
          Create Account
        </button>

<form action="../auth" method="post" id="auth-form"

      style="width: 100%; max-width: 650px; margin: 0 auto; box-sizing: border-box;">

    <input type="hidden" name="action" id="auth-action" value="signin">

        <!-- Extra signup field (First name / Username) toggled via JS -->
        <div class="hidden flex-col space-y-1.5 transition-all" id="field-name">
          <label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant ml-1">
            Full Name
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl">
              badge
            </span>
            <input
    name="fullName"
    id="auth-name"
    class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-full py-3.5 pl-11 pr-4 outline-none"
    placeholder="Camille Laurent"
    type="text"/>
          </div>
        </div>
        <!-- Email or Mobile -->
        <div class="flex flex-col space-y-1.5">
          <label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant ml-1">
            Email or Mobile Number
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl">
              local_cafe
            </span>
            <input
    class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-full py-3.5 pl-11 pr-4 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-secondary-container transition-all placeholder:text-on-surface-variant/50"
    id="auth-identity"
    name="identity"
    placeholder="you@coffeeclub.com"
    type="text"
    required/>
          </div>
        </div>
        <!-- Password -->
        <div class="flex flex-col space-y-1.5">
          <div class="flex justify-between items-center px-1">
            <label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">
              Password
            </label>
            <span class="hidden font-label-sticker text-label-sticker text-secondary uppercase" id="pwd-strength">
              Good Roast
            </span>
          </div>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl">
              lock
            </span>
            <input
    class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-full py-3.5 pl-11 pr-12 outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-secondary-container transition-all placeholder:text-on-surface-variant/50"
    id="auth-password"
    name="password"
    placeholder="••••••••••••"
    type="password"
    required/>
            <button aria-label="Toggle Password Visibility"
              class="absolute right-3.5 text-on-surface-variant hover:text-on-surface p-1 flex items-center justify-center rounded-full transition-colors"
              onclick="togglePasswordVisibility()" type="button">
              <span class="material-symbols-outlined text-xl" id="eye-icon">
                visibility
              </span>
            </button>
          </div>
        </div>
        <!-- Utility Row: Remember Me & Forgot Password -->
        <div class="flex items-center justify-between pt-1" id="signin-utilities">
          <label class="flex items-center space-x-2 cursor-pointer select-none">
            <input checked=""
              class="w-4 h-4 rounded text-primary-container accent-primary-container focus:ring-0 cursor-pointer"
              id="remember-me" type="checkbox" />
            <span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
          </label>
          <button class="font-label-md text-label-md text-primary hover:underline" type="button">
            Forgot password?
          </button>
        </div>
        <!-- Terms disclaimer for signup -->
        <div class="hidden text-center px-2 pt-1" id="signup-terms">
          <p class="font-body-sm text-body-sm text-on-surface-variant">
            By brewing an account, you agree to our
            <a class="text-primary font-semibold underline" href="#">Terms</a> &amp;
            <a class="text-primary font-semibold underline" href="#">Rewards Policy</a>.
          </p>
        </div>
        <!-- Big Burgundy Primary Button -->
        <button type="submit"
  class="w-full py-4 rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm text-center shadow-md hover:bg-primary transition-transform duration-200 active:scale-[0.98] flex items-center justify-center space-x-2"
  id="submit-btn">
          <span id="submit-text">Sign In to Blendique</span>
          <span class="material-symbols-outlined text-xl font-bold">arrow_forward</span>
        </button>
</form>
      <!-- Editorial Divider -->

     style="width:100%; max-width:650px; margin:24px auto;">

        <span
          class="font-label-sticker text-label-sticker uppercase tracking-widest text-on-surface-variant bg-surface px-3 absolute">

      </div>
      <!-- Social Authentication -->

        <div class="flex flex-col space-y-space-sm"
     style="width:100%; max-width:650px; margin:0 auto;">
        <!-- Google -->
        <button

        <!-- Apple -->

          type="button">

            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.87c.65-.79 1.09-1.89.97-2.99-.94.04-2.07.63-2.74 1.41-.59.68-1.11 1.79-.97 2.86 1.05.08 2.1-.5 2.74-1.28z">

          <span>Continue with Apple</span>
        </button>
      </div>
    
      <!-- Decorative Footer Ephemera -->
      <div class="flex items-center justify-center space-x-4 pt-space-xs text-on-surface-variant/60">
        <span class="font-label-sticker text-label-sticker tracking-widest uppercase flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">coffee_maker</span>
          Single Origin Sourcing
        </span>
        <span>•</span>
        <span class="font-label-sticker text-label-sticker tracking-widest uppercase flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">cloud_download</span>
          Artisanal Batch
        </span>
      </div>
    </div>
    <script>
      function switchAuthTab(mode) {
        const tabSignIn = document.getElementById('tab-signin');
        const tabSignUp = document.getElementById('tab-signup');
        const fieldName = document.getElementById('field-name');
        const signinUtils = document.getElementById('signin-utilities');
        const signupTerms = document.getElementById('signup-terms');
        const submitText = document.getElementById('submit-text');
        const pwdStrength = document.getElementById('pwd-strength');
        const authForm = document.getElementById('auth-form');
        const nameInput = document.getElementById('auth-name');
        document.getElementById('auth-action').value = mode;

authForm.action = (mode === 'signup') ? '../signup' : '../auth';

nameInput.required = (mode === 'signup');

        if (mode === 'signup') {
          tabSignUp.className = "flex-1 py-2.5 rounded-full text-center font-label-lg text-label-lg transition-all duration-200 bg-primary-container text-on-primary shadow-sm";
          tabSignIn.className = "flex-1 py-2.5 rounded-full text-center font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface";
          fieldName.classList.remove('hidden');
          fieldName.classList.add('flex');
          signinUtils.classList.add('hidden');
          signupTerms.classList.remove('hidden');
          pwdStrength.classList.remove('hidden');
          submitText.textContent = "Brew Your Account";
        } else {
          tabSignIn.className = "flex-1 py-2.5 rounded-full text-center font-label-lg text-label-lg transition-all duration-200 bg-primary-container text-on-primary shadow-sm";
          tabSignUp.className = "flex-1 py-2.5 rounded-full text-center font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface";
          fieldName.classList.add('hidden');
          fieldName.classList.remove('flex');
          signinUtils.classList.remove('hidden');
          signupTerms.classList.add('hidden');
          pwdStrength.classList.add('hidden');
          submitText.textContent = "Sign In to Blendique";
        }
      }

      function togglePasswordVisibility() {
        const pwdInput = document.getElementById('auth-password');
        const eyeIcon = document.getElementById('eye-icon');
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          eyeIcon.textContent = 'visibility_off';
        } else {
          pwdInput.type = 'password';
          eyeIcon.textContent = 'visibility';
        }
      }
    </script>
